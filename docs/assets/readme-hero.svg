      <text x="0" y="130" fill="white" font-size="56" font-weight="760" letter-spacing="-2.2">TV &amp; session</text><text x="0" y="192" fill="white" font-size="56" font-weight="760" letter-spacing="-2.2">manager.</text>
      <text x="0" y="244" fill="#AFBACB" font-size="19">One calm control surface for timers,</text><text x="0" y="273" fill="#AFBACB" font-size="19">TV screens, reservations and media.</text>
