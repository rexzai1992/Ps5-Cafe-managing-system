<svg width="1440" height="640" viewBox="0 0 1440 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PS5 Cafe TV and Session Manager</title>
  <desc id="desc">A dark blue illustration of the cafe management dashboard showing six television stations with playing, reserved, idle, expired, offline and paused states.</desc>
  <defs>
