    <linearGradient id="blue" x1="240" y1="160" x2="590" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#54AEFF"/><stop offset="1" stop-color="#0071E3"/></linearGradient>
    <linearGradient id="screen" x1="760" y1="92" x2="1325" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#1B2942"/><stop offset="1" stop-color="#0D1523"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(421 323) rotate(20) scale(520 390)"><stop stop-color="#0071E3" stop-opacity="0.25"/><stop offset="1" stop-color="#0071E3" stop-opacity="0"/></radialGradient>
